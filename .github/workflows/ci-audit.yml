name: CI Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify Node Version
        run: node -v

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint (if exists)
        run: |
          if npm run | grep -q "lint"; then
            npm run lint
          else
            echo "No lint script found"
          fi

      - name: Run TypeScript Check (if exists)
        run: |
          if npm run | grep -q "typecheck"; then
            npm run typecheck
          elif [ -f "tsconfig.json" ]; then
            npx tsc --noEmit
          else
            echo "No TypeScript config found"
          fi

      - name: Run Build (if exists)
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found"
          fi

      # BI_SERVER_BLOCK_v789_CI_AUDIT - `npm test` is only `tsc --noEmit && tsc`; run the real unit
      # suite (no database) instead.
      - name: Unit tests
        run: npm run test:unit

      # Keep the full JSON for the report artifact, then FAIL the job on any high or critical
      # finding (low/moderate are reported but do not block).
      - name: Run npm audit
        run: |
          npm audit --json > audit.json || true
          npm audit --audit-level=high

      - name: Generate Report
        if: always()
        run: |
          echo "Node version: $(node -v)" > report.txt
          echo "" >> report.txt
          echo "Dependency Audit:" >> report.txt
          if [ -f audit.json ]; then
            cat audit.json >> report.txt
          else
            echo "No audit data" >> report.txt
          fi

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ci-audit-report
          path: |
            report.txt
            audit.json
