name: guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  guardrails:
    name: Repo guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: All .sql files live in src/db/migrations
        shell: bash
        run: |
          set -euo pipefail
          # BI-Server's live migrator (src/startup/runMigrations.ts)
          # reads from src/db/migrations/ only. Any .sql elsewhere in
          # the repo will never run on startup. Exceptions: scripts/
          # (operator-run repair scripts) and node_modules.
          offenders=$(find . \
            -type d \( -name node_modules -o -name .git -o -name dist -o -name scripts \) -prune \
            -o -type f -name '*.sql' -print \
            | grep -v '^./src/db/migrations/' \
            || true)
          if [ -n "$offenders" ]; then
            echo "::error::All migration .sql files must live in src/db/migrations/. Files outside that directory will not run on startup."
            echo "Offending files:"
            echo "$offenders"
            echo ""
            echo "Move them to src/db/migrations/ with IF NOT EXISTS guards."
            exit 1
          fi
          echo "All SQL files are in src/db/migrations/. OK."

      # BI_SERVER_UNIT_TESTS_IN_CI_v6
      # Until now `npm test` was `tsc --noEmit && tsc` and vitest was never
      # invoked by any workflow, so every test in this repo was written and
      # merged without ever executing. These two steps are the fix.
      # BI_SERVER_GUARDRAILS_NODE_v7
      # 20.11.1 (what ci-audit.yml pins, matching the App Service runtime) is
      # too old for the test runner: vitest 4 loads a rolldown bundle that
      # imports `styleText` from node:util, and that export first appears in
      # Node 20.12. On 20.11.1 vitest dies at startup with
      # "does not provide an export named 'styleText'" before a single test
      # loads - which is what broke this job the moment tests were wired in.
      #
      # Pinned to 22 here only. ci-audit.yml keeps 20.11.1 because it builds
      # and typechecks the artifact that actually ships; nothing about running
      # unit tests needs to match the production runtime.
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Live schema drift
        run: npm run check:schema

      - name: Unit tests
        run: npm run test:unit
